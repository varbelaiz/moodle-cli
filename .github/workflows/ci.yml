name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and types are version-independent, so they run once rather than per matrix entry.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the full version: setup-uv publishes v9.0.0 but no floating v9 tag.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  # Catches a broken hatch-vcs/packaging config on every PR, not only when a tag is pushed
  # and release.yml runs `uv build` for real. Its own job, not a `lint` step, so `lint`'s
  # checkout can stay shallow: hatch-vcs needs full history and tags to compute a version,
  # the same reason release.yml's checkout uses fetch-depth: 0.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv build

  # The floor and ceiling of the supported range, plus what is in between:
  # pyproject declares requires-python >=3.11.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }}
      # No --live: the integration suite needs real campus credentials and is
      # skipped by default. Keep it that way, so CI never needs a token.
      - name: pytest
        run: uv run pytest

  # `uv sync` alone installs no plugin, so its own tests, mypy and ruff would otherwise
  # never run against real code. One job per plugin, syncing that plugin's extra.
  plugin-anydoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra anydoc
      - name: mypy
        working-directory: plugins/anydoc
        run: uv run mypy
      - name: pytest
        working-directory: plugins/anydoc
        run: uv run pytest

  plugin-panopto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra panopto
      - name: mypy
        working-directory: plugins/panopto
        run: uv run mypy
      - name: pytest
        working-directory: plugins/panopto
        run: uv run pytest
