[project]
name = "moodle-cli-panopto"
version = "0.1.0"
description = "List Panopto-hosted class recordings and convert their transcripts to markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "moodle-cli>=0.1.0,<0.2.0",
]

[project.entry-points."moodle_cli.plugins"]
panopto = "moodle_cli_panopto:PanoptoPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_cli_panopto"]

[tool.uv.sources]
moodle-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real campus; skipped unless --live is passed",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
