[project]
name = "moodle-cli-anydoc"
version = "0.1.0"
description = "Convert course documents to markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "firecrawl-anydoc>=0.1.4",
    "httpx>=0.27",
    "moodle-cli>=0.1.0,<0.2.0",
]

[project.entry-points."moodle_cli.plugins"]
anydoc = "moodle_cli_anydoc:AnydocPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_cli_anydoc"]

[tool.uv.sources]
moodle-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
