[project]
name = "moodle-cli"
dynamic = ["version"]
description = "CLI and MCP server for a Moodle campus: courses, contents, downloads and participants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "mcp>=1.2",
    "packaging>=24.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
anydoc = ["moodle-cli-anydoc"]
panopto = ["moodle-cli-panopto"]

[project.scripts]
moodle = "moodle_cli.cli:main"
moodle-mcp = "moodle_cli.mcp_server:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_cli"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/moodle_cli/_version.py"

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
moodle-cli-anydoc = { workspace = true }
moodle-cli-panopto = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real campus; skipped unless --live is passed",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
