[project]
name = "moodle-cli"
version = "0.1.0"
description = "CLI and MCP server for a Moodle campus: courses, contents, downloads and participants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "mcp>=1.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real campus; skipped unless --live is passed",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
